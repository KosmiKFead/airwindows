name: Build Ultralight2Flutter

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Upgrade Legacy VS Project
        run: |
          vcupgrade plugins/WinVST/Ultralight2/VSTProject.vcxproj

      - name: Build VST (x64)
        run: |
          msbuild plugins/WinVST/Ultralight2/VSTProject.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0
        continue-on-error: true

      - name: Build VST (Win32 Fallback)
        run: |
          msbuild plugins/WinVST/Ultralight2/VSTProject.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultralight2Flutter-Win
          path: |
            plugins/WinVST/Ultralight2/**/*.dll
            plugins/WinVST/Ultralight2/**/*.vst3
