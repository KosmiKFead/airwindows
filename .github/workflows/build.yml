name: Build Ultralight2Flutter

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download VST2 SDK Headers
        run: |
          git clone --depth 1 https://github.com/R-Tur/VST_SDK_2.4.git vstsdk

      - name: Compile with Dynamic SDK Discovery
        shell: pwsh
        run: |
          Set-Location "plugins/WinVST/Ultralight2"
          
          # Dynamically locate all required SDK source files anywhere in the repo
          $ae  = (Get-ChildItem -Path "../.." -Recurse -Filter "audioeffect.cpp" | Select-Object -First 1).FullName
          $aex = (Get-ChildItem -Path "../.." -Recurse -Filter "audioeffectx.cpp" | Select-Object -First 1).FullName
          $vpm = (Get-ChildItem -Path "../.." -Recurse -Filter "vstplugmain.cpp" | Select-Object -First 1).FullName
          $sdk = (Get-ChildItem -Path "../.." -Recurse -Filter "aeffect.h" | Select-Object -First 1).Directory.Parent.Parent.FullName
          
          Write-Host "Found audioeffect.cpp at: $ae"
          Write-Host "Found audioeffectx.cpp at: $aex"
          Write-Host "Found vstplugmain.cpp at: $vpm"
          Write-Host "Found SDK root at: $sdk"
          
          # Initialize MSVC compiler environment
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $installPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $installPath -arch amd64
          
          # Compile custom code + discovered SDK boilerplate using absolute paths
          cl /O2 /LD Ultralight2.cpp Ultralight2Proc.cpp "$ae" "$aex" "$vpm" /I "$sdk" /I "$sdk/public.sdk/source/vst2.x" /link /DEF:vstplug.def /OUT:Ultralight2Flutter.dll

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultralight2Flutter-Win64
          path: plugins/WinVST/Ultralight2/Ultralight2Flutter.dll
