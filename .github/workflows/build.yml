name: Build Ultralight2Flutter

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download VST2 SDK Headers
        run: |
          git clone --depth 1 https://github.com/R-Tur/VST_SDK_2.4.git vstsdk

      - name: Compile Plugin with SDK and Boilerplate
        shell: pwsh
        run: |
          Set-Location "plugins/WinVST/Ultralight2"
          
          # Initialize MSVC compiler environment
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $installPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $installPath -arch amd64
          
          # Compile custom source files + required VST2 SDK implementation boilerplate
          cl /O2 /LD Ultralight2.cpp Ultralight2Proc.cpp `
             ../../../vstsdk/public.sdk/source/vst2.x/audioeffect.cpp `
             ../../../vstsdk/public.sdk/source/vst2.x/audioeffectx.cpp `
             ../../../vstsdk/public.sdk/source/vst2.x/vstplugmain.cpp `
             /I "../../../vstsdk" /I "../../../vstsdk/public.sdk/source/vst2.x" `
             /link /DEF:vstplug.def /OUT:Ultralight2Flutter.dll

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultralight2Flutter-Win64
          path: plugins/WinVST/Ultralight2/Ultralight2Flutter.dll
