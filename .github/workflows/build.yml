name: Build Ultralight2Flutter

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnostic Build & Sleuth
        shell: pwsh
        run: |
          Set-Location "plugins/WinVST/Ultralight2"
          
          Write-Host "--- 1. CHECKING FOLDER CONTENTS ---"
          Get-ChildItem | Select-Object Name
          
          Write-Host "--- 2. LOCATING VST HEADERS IN REPO ---"
          Get-ChildItem -Path "../.." -Recurse -Filter "audioeffectx.h" | Select-Object FullName
          
          Write-Host "--- 3. INITIALIZING COMPILER ---"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $installPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $installPath -arch amd64
          
          Write-Host "--- 4. RUNNING COMPILER ---"
          cl /O2 /LD Ultralight2.cpp Ultralight2Proc.cpp /link /DEF:vstplug.def /OUT:Ultralight2Flutter.dll
