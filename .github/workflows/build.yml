name: Build Ultralight2Flutter

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download VST2 SDK Headers
        run: |
          git clone --depth 1 https://github.com/R-Tur/VST_SDK_2.4.git vstsdk

      - name: Bulletproof Compile & Verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root =$env:GITHUB_WORKSPACE
          
          Write-Host "--- 1. ENVIRONMENT SETUP ---"
          $pluginDir = "$root/plugins/WinVST/Ultralight2"
          Set-Location $pluginDir
          
          # Resolve absolute paths for SDK components
          $ae  = "$root/vstsdk/public.sdk/source/vst2.x/audioeffect.cpp"
          $aex = "$root/vstsdk/public.sdk/source/vst2.x/audioeffectx.cpp"
          $vpm = "$root/vstsdk/public.sdk/source/vst2.x/vstplugmain.cpp"
          $sdk = "$root/vstsdk"
          
          Write-Host "--- 2. VERIFYING DEPENDENCIES ---"
          $requiredFiles = @("$pluginDir/Ultralight2.cpp", "$pluginDir/Ultralight2Proc.cpp", "$pluginDir/vstplug.def", $ae, $aex,$vpm)
          foreach ($file in$requiredFiles) {
              if (-not (Test-Path $file)) {
                  throw "CRITICAL: Required build file missing -> $file"
              }
              Write-Host "Found: $(Split-Path$file -Leaf)"
          }
          
          Write-Host "--- 3. INITIALIZING MSVC COMPILER ---"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = &$vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw "Could not locate Visual Studio installation path." }
          
          Import-Module (Join-Path $installPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $installPath -arch amd64
          
          Write-Host "--- 4. EXECUTING COMPILER & LINKER ---"
          cl /O2 /LD Ultralight2.cpp Ultralight2Proc.cpp "$ae" "$aex" "$vpm" `
             /I "$sdk" /I "$sdk/public.sdk/source/vst2.x" /I "$sdk/pluginterfaces/vst2.x" `
             /link /DEF:vstplug.def /OUT:Ultralight2Flutter.dll
             
          if ($LASTEXITCODE -ne 0) {
              throw "Compilation or linking failed with exit code $LASTEXITCODE"
          }
          
          Write-Host "--- 5. VERIFYING OUTPUT ARTIFACT ---"
          if (-not (Test-Path "Ultralight2Flutter.dll")) {
              throw "Build completed but Ultralight2Flutter.dll was not found!"
          }
          Write-Host "SUCCESS: Ultralight2Flutter.dll successfully built!"

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultralight2Flutter-Win64
          path: plugins/WinVST/Ultralight2/Ultralight2Flutter.dll
