name: Build Ultralight2Flutter

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download VST2 SDK Headers
        run: |
          git clone --depth 1 https://github.com/R-Tur/VST_SDK_2.4.git vstsdk

      - name: Scan All C++ Files in Workspace
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          Write-Host "--- SCANNING ALL .CPP FILES IN WORKSPACE ---"
          Get-ChildItem -Path $root -Recurse -Filter "*.cpp" | Select-Object FullName
